<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none" role="img" aria-labelledby="coabana-tile-title">
  <title id="coabana-tile-title">Coabana</title>
  <!-- Coabana's tile: index.html's inline glyph with the dark theme's colours
       as literals on a #07131d square (DESIGN.md § Marca gráfica). The glyph
       is centred on its drawn extent, not on its 48 box, so it stays whole in
       the tile's inscribed circle when a host crops it round. The source of
       the favicons and of the structured-data logo; ids carry the
       coabana-tile- prefix so the file can be inlined beside other SVGs. -->
  <defs>
    <linearGradient id="coabana-tile-trunk" x1="20" y1="18" x2="22" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fd6c3"/><stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>
  <rect width="60" height="60" rx="13" fill="#07131d"/>
  <g transform="translate(8 4)">
    <circle cx="33" cy="13" r="6" fill="#ff8f6b"/>
    <path d="M22 42c0-10-1-18-2-24" stroke="url(#coabana-tile-trunk)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 18C14 14 8 14 4 17c6 1 11 3 16 5" stroke="#2fd6c3" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18c-2-7-7-10-12-10 4 4 7 8 10 12" stroke="#2fd6c3" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18c2-6 7-9 13-8-5 3-8 6-11 10" stroke="#2fd6c3" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18c6-2 12 0 15 4-6-1-11-1-15-1" stroke="#2fd6c3" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M4 42c4-3 8-3 12 0s8 3 12 0 8-3 12 0" stroke="#4cc9f0" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
