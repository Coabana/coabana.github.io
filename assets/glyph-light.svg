<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-labelledby="coabana-glyph-title">
  <title id="coabana-glyph-title">Coabana</title>
  <!-- Coabana's glyph (sun, palm, wave), light variant for paper or white,
       colours as literals (DESIGN.md § Marca gráfica). The group's
       translate(3 -2.075) centres the ink, miter tips included, on the
       48 box: ink x 3.79-44.20, y 4.625-43.375. Ids carry the
       coabana-glyph- prefix so the file can be inlined beside other SVGs. -->
  <defs>
    <linearGradient id="coabana-glyph-trunk" x1="20" y1="18" x2="22" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b8b7d"/><stop offset="1" stop-color="#0f7ea6"/>
    </linearGradient>
  </defs>
  <g transform="translate(3 -2.075)">
