    <path d="M22 42c0-10-1-18-2-24" stroke="url(#coabana-glyph-trunk)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 18C14 14 8 14 4 17c6 1 11 3 16 5" stroke="#0b8b7d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18C18 11 13 8 8 8C11 12.6 15.6 15.4 20 18" stroke="#0b8b7d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18C22 12 27 9 33 10C28.4 14 23.6 16.8 20 18" stroke="#0b8b7d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 18c6-2 12 0 15 4-6-1-11-1-15-1" stroke="#0b8b7d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M4 42c4-3 8-3 12 0s8 3 12 0 8-3 12 0" stroke="#0f7ea6" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
