name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request supersedes its run; a push run on `main`
# always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the Commit subjects step reads the pull request's
          # commits.
          fetch-depth: 0

      - name: HTML valid
        # The two pages a visitor reaches, through the W3C Nu checker that
        # html5validator bundles (Java ships with the runner). The Search
        # Console verification file is not a page and is left out. The
        # bundled checker predates `background-clip: text`, which 404.html
        # uses and browsers support unprefixed; that one message is ignored.
        if: '!cancelled()'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet html5validator==0.4.2
          "$RUNNER_TEMP/venv/bin/html5validator" --files index.html 404.html \
            --ignore-re 'CSS: "background-clip": "text" is not a "background-clip" value'

      - name: i18n keys in parity
        # `js/i18n.js` holds one `es` and one `en` dictionary: the same keys
        # in both, none twice, and every key `index.html` names through a
        # `data-i18n` attribute present in them.
        if: '!cancelled()'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys

          src = open("js/i18n.js", encoding="utf-8").read()
          blocks = dict(re.findall(r"^  (es|en): \{\n(.*?)^  \}", src, re.S | re.M))
          if set(blocks) != {"es", "en"}:
              print(f"::error file=js/i18n.js::expected the es and en dictionaries, found {sorted(blocks)}")
              sys.exit(1)
          keys = {lang: re.findall(r'^    "([^"]+)":', body, re.M) for lang, body in blocks.items()}
          failed = False
          for lang, found in keys.items():
              twice = sorted({k for k in found if found.count(k) > 1})
              if twice:
                  print(f"::error file=js/i18n.js::{lang} repeats {twice}")
                  failed = True
          es, en = set(keys["es"]), set(keys["en"])
          if es != en:
              print(f"::error file=js/i18n.js::only in es: {sorted(es - en)}; only in en: {sorted(en - es)}")
              failed = True
          html = open("index.html", encoding="utf-8").read()
          used = set(re.findall(r'data-i18n(?:-[a-z-]+)?="([^"]+)"', html))
          missing = sorted(used - (es & en))
          if missing:
              print(f"::error file=index.html::data-i18n keys missing from js/i18n.js: {missing}")
              failed = True
          print(f"{len(es)} es keys, {len(en)} en keys, {len(used)} named by index.html")
          sys.exit(1 if failed else 0)
          PY

      - name: Sitemap well-formed
        # `sitemap.xml` parses as XML in the sitemap namespace, and every
        # `<url>` has a `<loc>` on the site and a `<lastmod>` date.
        if: '!cancelled()'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import sys
          import xml.etree.ElementTree as ET

          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          root = ET.parse("sitemap.xml").getroot()
          urls = root.findall("s:url", ns)
          failed = root.tag != "{%s}urlset" % ns["s"] or not urls
          for url in urls:
              loc = url.findtext("s:loc", "", ns)
              lastmod = url.findtext("s:lastmod", "", ns)
              if not loc.startswith("https://coabana.github.io/"):
                  print(f"::error file=sitemap.xml::loc off the site: {loc!r}")
                  failed = True
              try:
                  datetime.date.fromisoformat(lastmod)
              except ValueError:
                  print(f"::error file=sitemap.xml::lastmod not a date: {lastmod!r} ({loc})")
                  failed = True
          if failed and not urls:
              print("::error file=sitemap.xml::no <urlset> of <url> entries")
          print(f"{len(urls)} urls")
          sys.exit(1 if failed else 0)
          PY

      - name: Shared blocks unchanged
        # Each line of the manifest is `<sha256>  <name>  <path>`: the block
        # between `<!-- <name>:shared begin -->` and `<!-- <name>:shared end -->`
        # in <path>, marker lines included, must hash to <sha256>. A marker is
        # a line that equals the marker text, present exactly once.
        if: '!cancelled()'
        shell: bash
        run: |
          fail=0
          manifest=.claude/.shared-blocks.sha256
          if [ ! -s "$manifest" ]; then
            echo "::error::$manifest is missing or empty"; exit 1
          fi
          while read -r want name path; do
            [ -n "$want" ] || continue
            begin="<!-- ${name}:shared begin -->"
            end="<!-- ${name}:shared end -->"
            if [ ! -f "$path" ]; then
              echo "::error::$manifest names $path, which does not exist"; fail=1; continue
            fi
            if [ "$(grep -c -x -F "$begin" "$path")" != 1 ] || [ "$(grep -c -x -F "$end" "$path")" != 1 ]; then
              echo "::error file=$path::the $name markers must each appear exactly once"; fail=1; continue
            fi
            block="$RUNNER_TEMP/$name.block"
            awk -v b="$begin" -v e="$end" '$0==b{p=1} p{print} $0==e{p=0}' "$path" > "$block"
            if [ ! -s "$block" ]; then
              echo "::error file=$path::the $name block is empty"; fail=1; continue
            fi
            got=$(sha256sum "$block" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error file=$path::the $name block changed (sha256 $got, manifest $want)"; fail=1
            else
              echo "$name: ok"
            fi
          done < "$manifest"
          exit "$fail"

      - name: Commit subjects
        # The whole first line of every commit the pull request adds: at most
        # 72 characters, no trailing period. A pull request opened by
        # Dependabot is exempt; its subjects are the bot's.
        if: "!cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'"
        shell: bash
        env:
          LC_ALL: C.UTF-8
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::${#subject} characters (max 72): $subject"; fail=1
            fi
            case "$subject" in
              *.) echo "::error::trailing period: $subject"; fail=1 ;;
            esac
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$fail"

      - name: Commit authors
        # Every commit the pull request adds, or a push to `main` brings, is
        # authored as roannylamaslopez@gmail.com. Two exceptions: Dependabot's
        # heads (49699333+dependabot[bot]@users.noreply.github.com) and
        # GitHub's own commits (noreply@github.com). History before this gate
        # is not read: the commits of #20 carry the employer's address.
        if: "!cancelled() && (github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000')"
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          fail=0
          while read -r sha email; do
            case "$email" in
              "roannylamaslopez@gmail.com") ;;
              "49699333+dependabot[bot]@users.noreply.github.com") ;;
              "noreply@github.com") ;;
              *) echo "::error::commit $sha is authored as $email (expected roannylamaslopez@gmail.com)"; fail=1 ;;
            esac
          done < <(git log --format='%h %ae' "$BASE_SHA..$HEAD_SHA")
          exit "$fail"
